# Server Configuration
server.port=${SERVER_PORT:8080}

# PostgreSQL Datasource Configuration (Defaults to Docker pgvector on 5433, configurable via env vars)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:claimwise}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:claimwise}
spring.datasource.password=${DB_PASSWORD:claimwise}

# HikariCP Pool Configuration
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.pool-name=ClaimWiseHikariPool

# JPA / Hibernate Configuration (Schema validated, NOT generated by Hibernate)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# SpringDoc OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# Stage 2: Hugging Face Embedding Configuration (BAAI/bge-small-en-v1.5)
claimwise.ai.embedding.provider=${EMBEDDING_PROVIDER:huggingface}
claimwise.ai.embedding.model=${HUGGINGFACE_EMBEDDING_MODEL:BAAI/bge-small-en-v1.5}
claimwise.ai.embedding.api-url=${HUGGINGFACE_API_URL:https://api-inference.huggingface.co/pipeline/feature-extraction/BAAI/bge-small-en-v1.5}
claimwise.ai.embedding.api-key=${HUGGINGFACE_API_KEY:}
claimwise.ai.embedding.dimensions=${EMBEDDING_DIMENSIONS:384}

# Stage 2: Chunking & Retrieval Configuration
claimwise.ai.chunking.chunk-size=${CHUNKING_SIZE:500}
claimwise.ai.chunking.chunk-overlap=${CHUNKING_OVERLAP:50}
claimwise.ai.retrieval.top-k=${RETRIEVAL_TOP_K:3}

# Stage 3 Placeholder: Groq LLM Configuration (Scaffolding only, not used in Stage 2)
claimwise.ai.llm.groq.api-key=${GROQ_API_KEY:}
claimwise.ai.llm.groq.model=${GROQ_MODEL:}
claimwise.ai.llm.groq.base-url=${GROQ_BASE_URL:https://api.groq.com/openai/v1}
