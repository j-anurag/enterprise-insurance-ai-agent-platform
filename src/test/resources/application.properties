# Test Database Configuration (In-Memory H2 in PostgreSQL Mode with Flyway validation)
spring.datasource.url=jdbc:h2:mem:claimwisedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-h2

spring.jpa.open-in-view=false
spring.jpa.show-sql=false
